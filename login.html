 <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/login.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <title>Tech-Store | Login</title>
</head>

<body>

  <!-- Start Login -->
  <main class="login">

    <div class="login-container">

      <!-- Logo -->
      <div class="logo">
        <img src="images/logo.png" alt="Tech-Store Logo">
      </div>

      <h1>Welcome Back</h1>
      <p>Login to your Tech-Store account</p>

      <!-- Login Form -->
      <form action="Index.html">

        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input
            type="email"
            placeholder="Email"
            required>
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            placeholder="Password"
            required>
        </div>

        <div class="remember">
          <label>
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">
          Login
        </button>

      </>

      <div class="signup">
        <p>Don't have an account?</p>
        <a href="#">Create Account</a>
      </div>

    </div>

  </main>
  <!-- End Login -->
  <script src="js/jquery-4.0.0.min.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
