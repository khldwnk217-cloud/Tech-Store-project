<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>tech | store contact</title>
  </head>
  <body>
    <header>
      <div class="container">
        <a href="#" class="logo">
          <img src="images/logo.png" alt="logo" />
        </a>
        <nav>
          <i class="fa-solid fa-bars toggle-menu"></i>
          <ul>
            <li><a href="Index.html">home </a></li>
            <li><a href="products.html">prodect</a></li>
            <li><a href="gallery.html">gallery</a></li>
            <li><a href="offers.html">offers</a></li>
            <li><a href="contact.html" class="active">contact</a></li>
            <li><a href="login.html">login</a></li>
          </ul>
          <div class="form">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </nav>
      </div>
    </header>
    <!-- end header -->

    <!-- class contact us -->
    <div class="contact-container">
      <h2>تواصل معنا</h2>
      <p>يسعدنا استقبال استفساراتك واقتراحاتك في أي وقت.</p>

      <!--  communecate model -->
      <form id="contactForm">
        <div class="form-group">
          <label for="name">full name:</label>
          <input type="text" id="name" required placeholder="enter your name" />
        </div>

        <div class="form-group">
          <label for="email">email:</label>
          <input
            type="email"
            id="email"
            required
            placeholder="example@mail.com"
          />
        </div>

        <div class="form-group">
          <label for="message">message:</label>
          <textarea
            id="message"
            rows="4"
            required
            placeholder="write your message here..."
          ></textarea>
        </div>

        <button type="submit" class="btn-send">send message</button>
      </form>

      <!-- jQuery -->
      <div
        id="statusMessage"
        style="
          display: none;
          margin-top: 15px;
          color: green;
          font-weight: bold;
          text-align: center;
        "
      >
        تم إرسال رسالتك بنجاح!
      </div>
    </div>

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/main.js"></script>
    <script>
      $(document).ready(function () {
        //  jQuery
        $("#contactForm").submit(function (e) {
          e.preventDefault(); // منع إعادة تحميل الصفحة

          // إخفاء النموذج وإظهار رسالة النجاح بسلاسة
          $(this).slideUp(300);
          $("#statusMessage").fadeIn(500);
        });
      });
    </script>
  </body>
</html>
